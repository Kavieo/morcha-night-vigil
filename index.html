<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>MORCHA — Night Vigil</title>
<style>
:root{
  --bg:#0b0f0e; --panel:#111816; --panel2:#151e1b; --line:#22302b; --line2:#2d3e38;
  --text:#dfe9e4; --dim:#7b8e86; --faint:#4d5e57;
  --grn:#4ade80; --amber:#fbbf24; --red:#f87171;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:radial-gradient(1200px 600px at 50% -10%,#16231e 0%,var(--bg) 60%);color:var(--text);font:14px/1.45 var(--sans)}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
.wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 16px}
.box{width:min(420px,100%);background:var(--panel);border:1px solid var(--line2);border-radius:16px;padding:30px}
.kick{font-size:11px;font-weight:700;letter-spacing:.16em;color:var(--dim);text-transform:uppercase}
h1{margin:6px 0 2px;font-size:34px;letter-spacing:.06em;color:var(--amber)}
.lead{margin:0 0 20px;color:var(--dim)}
label.f{display:flex;flex-direction:column;gap:6px;font-size:12px;color:var(--dim);font-weight:600;letter-spacing:.04em;margin-bottom:12px}
label.f input{height:46px;border-radius:10px;border:1px solid var(--line2);background:var(--panel2);padding:0 12px;font-size:15px}
label.f input:focus{outline:2px solid var(--amber);outline-offset:-1px}
label.chk{display:flex;align-items:center;gap:8px;font-size:13px;margin:4px 0 6px}
label.chk input{width:18px;height:18px;accent-color:var(--amber)}
#err{color:var(--red);font-size:13px;min-height:20px}
#go{width:100%;height:48px;border-radius:10px;border:0;background:var(--amber);color:#111;font-weight:800;font-size:15px}
#go:disabled{opacity:.6;cursor:wait}
.lock{color:var(--faint);font-size:11.5px;margin-top:12px}

#home{display:none;width:min(980px,100%)}
#home .hd{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:18px}
#home h1{font-size:30px}
#who{color:var(--dim);font-size:13px}
#who b{color:var(--text)}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.tile{display:flex;flex-direction:column;gap:8px;text-align:left;background:var(--panel);border:1px solid var(--line2);border-radius:14px;padding:22px;min-height:180px;transition:border-color .15s,transform .15s}
.tile:hover{border-color:var(--amber);transform:translateY(-2px)}
.tile .ic{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:var(--panel2);border:1px solid var(--line2)}
.tile h2{margin:6px 0 0;font-size:18px}
.tile p{margin:0;color:var(--dim);font-size:13px}
.tile .go2{margin-top:auto;font-weight:700;color:var(--amber);font-size:13px}
.foot{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-top:18px;color:var(--dim);font-size:12.5px}
.btn{height:34px;padding:0 14px;border-radius:8px;border:1px solid var(--line2);background:var(--panel2);font-weight:600;font-size:13px}
#st.ok{color:var(--grn)} #st.warn{color:var(--amber)}
@media (max-width:760px){ .tiles{grid-template-columns:1fr} .tile{min-height:0} }
</style>
</head>
<body>
<div class="wrap">
  <form class="box" id="login" autocomplete="on">
    <div class="kick">125 Bn BSF · Night observation simulator</div>
    <h1>MORCHA</h1>
    <p class="lead">Sign in to run training and see the records.</p>
    <label class="f">Username<input id="u" name="username" autocomplete="username" spellcheck="false" required></label>
    <label class="f">Password<input id="p" name="password" type="password" autocomplete="current-password" required></label>
    <label class="chk"><input id="rem" type="checkbox"> Keep me signed in on this computer</label>
    <div id="err"></div>
    <button id="go" type="submit">Sign in</button>
    <div class="lock">Records are encrypted (AES-256) and open only with the correct username and password.</div>
  </form>

  <div id="home">
    <div class="hd">
      <div><div class="kick">125 Bn BSF · Night observation simulator</div><h1>MORCHA</h1></div>
      <div id="who"></div>
    </div>
    <div class="tiles">
      <button class="tile" id="t_trainee">
        <span class="ic"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fbbf24" stroke-width="2"><rect x="2" y="4" width="20" height="13" rx="2"/><path d="M8 21h8M12 17v4"/></svg></span>
        <h2>Trainee screen</h2>
        <p>The sentry's view, for the projector or big screen. Enter the trainee's name and session length, then start.</p>
        <span class="go2">Open in a new tab →</span>
      </button>
      <button class="tile" id="t_console">
        <span class="ic"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fbbf24" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M9 21V9"/></svg></span>
        <h2>Instructor console</h2>
        <p>See what he sees with every contact marked, confirm his reports, and run the session. Same computer or another one.</p>
        <span class="go2">Open in a new tab →</span>
      </button>
      <button class="tile" id="t_records">
        <span class="ic"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fbbf24" stroke-width="2"><path d="M4 4h16v16H4z"/><path d="M8 9h8M8 13h8M8 17h5"/></svg></span>
        <h2>Training records</h2>
        <p>Training History 2026: everyone trained, scores, simulator sessions. Add people and export to Excel.</p>
        <span class="go2">Open →</span>
      </button>
    </div>
    <div class="foot"><span id="st"></span><button class="btn" id="out">Sign out</button></div>
  </div>
</div>

<script src="src/store.js"></script>
<script>
(function () {
  const $ = id => document.getElementById(id);
  const q = new URLSearchParams(location.search), next = q.get('next');
  q.delete('next'); const rest = q.toString() ? '?' + q.toString() : '';

  function home() {
    /* came here from a screen that needs a sign-in: go straight back to it */
    if (next === 'trainee') return location.replace('trainee.html' + rest);
    if (next === 'console') return location.replace('instructor.html' + rest);
    $('login').style.display = 'none'; $('home').style.display = 'block';
    $('who').innerHTML = 'Signed in as <b>' + Store.user() + '</b>';
  }
  Store.on(() => { const s = Store.status(); $('st').textContent = s.text; $('st').className = s.cls; });

  $('login').onsubmit = async e => {
    e.preventDefault();
    $('err').textContent = ''; $('go').disabled = true; $('go').textContent = 'Checking…';
    try { await Store.login($('u').value, $('p').value, $('rem').checked); $('p').value = ''; home(); }
    catch (err) { $('err').textContent = 'Wrong username or password.'; }
    finally { $('go').disabled = false; $('go').textContent = 'Sign in'; }
  };
  Store.resume().then(ok => { if (ok) home(); else $('u').focus(); });

  $('t_trainee').onclick = () => window.open('trainee.html', 'morchaTrainee');
  $('t_console').onclick = () => window.open('instructor.html', 'morchaConsole');
  $('t_records').onclick = () => { location.href = 'records.html'; };
  $('out').onclick = () => { Store.logout(); location.replace('index.html'); };
})();
</script>
</body>
</html>
